rgba(255,122,47,.24)}.mini.red{color:#ff6b6b;border-color:rgba(255,107,107,.22)}.mini.blue{color:#8aa8ff;border-color:rgba(138,168,255,.22)}.inspector{position:sticky;top:0;background:#11141d;border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:14px}.inspector.empty{min-height:220px;display:grid;place-items:center;text-align:center;font:400 9px JetBrains Mono;color:rgba(238,241,245,.25)}.ins-top{display:flex;gap:9px;align-items:flex-start}.ins-top .ava{width:39px;height:39px}.ins-name{font-size:12px;font-weight:700}.ins-meta{font:400 8px JetBrains Mono;color:rgba(238,241,245,.28);margin-top:3px;line-height:1.5;word-break:break-all}.statusbar{margin:10px 0 12px;font:500 8px JetBrains Mono;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}.statusbar.open{color:#39dca6;border-color:rgba(57,220,166,.22);background:rgba(57,220,166,.04)}.statusbar.locked{color:#ff6b6b;border-color:rgba(255,107,107,.22);background:rgba(255,107,107,.04)}.ins-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.istat{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);border-radius:10px;padding:9px}.istat label{font:500 8px JetBrains Mono;color:rgba(238,241,245,.28);text-transform:uppercase}.istat b{display:block;font-size:15px;margin-top:5px}.section{border-top:1px solid rgba(255,255,255,.06);margin-top:12px;padding-top:12px}.section h4{margin:0 0 8px;font:500 8px JetBrains Mono;color:rgba(238,241,245,.28);text-transform:uppercase;letter-spacing:1px}.section-actions{display:flex;gap:5px;flex-wrap:wrap}.feature{height:26px;border:1px solid rgba(255,255,255,.07);background:#171b24;color:rgba(238,241,245,.34);border-radius:7px;padding:0 7px;font:500 8px JetBrains Mono;cursor:pointer}.feature.on{color:#ff8e4c;border-color:rgba(255,122,47,.26);background:rgba(255,122,47,.05)}.timeline{display:flex;flex-direction:column;gap:8px}.tl{display:grid;grid-template-columns:9px 1fr;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background .55fr .65fr .8fr 1fr .45fr 1fr}}@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:12px}.grid4,.summary{grid-template-columns:1fr 1fr}.workspace{display:block}.users-table{overflow:auto}.uhead,.urow{min-width:980px}.feed-row{grid-template-columns:100px 70px 1fr}.fdetail{grid-column:1/-1}}

<script>
const SB_URL='https://kgutmsosfyyxnlnhucaa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtndXRtc29zZnl5eG5sbmh1Y2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4Njk2NTMsImV4cCI6MjA4ODQ0NTY1M30.yDPTEkhCvVNpLjSSUqEqD_UTR5N0IeZKtkLCNpW7W_Q';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let users=[],trades=[],payments=[],audit=[],selected=new Set(),selectedUser=null;
const FEATURES=['journal','dashboard','progress','digest','premarket','coach','aichat','screener'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(msg,type=''){const e=document.getElementById('toast');e.textContent=msg;e.className='toast show '+(type==='ok'?'ok':type==='err'?'err':'');clearTimeout(window._tt);window._tt=setTimeout(()=>e.className='toast',2500)}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function ago(v){if(!v)return'—';let n=Math.max(0,Date.now()-new Date(v).getTime()),m=Math.floor(n/60000);if(m<1)return'сейчас';if(m<60)return m+'м';let h=Math.floor(m/60);if(h<24)return h+'ч';let d=Math.floor(h/24);if(d<30)return d+'д';return Math.floor(d/30)+'мес'}
function nameOf(u){return u?.full_name||u?.username||u?.email||'Unknown'}
function planOf(u){return u.plan==='lifetime'?'lifetime':u.plan==='monthly'?'monthly':'free'}
function pill(u){let p=planOf(u),l=p==='lifetime'?'∞ Lifetime':p==='monthly'?'Monthly':'Free';return `<span class="pill ${p==='lifetime'?'life':p==='monthly'?'month':'free'}">${l}</span>`}
function tradeStats(id){let a=trades.filter(x=>x.user_id===id),w=a.filter(x=>x.result==='win').length,p=a.reduce((s,x)=>s+(+x.pnl_usd||0),0);return{n:a.length,wr:a.length?Math.round(w/a.length*100):0,p,last:a[0]||null}}
function lastActivity(u){let a=[u.created_at,u.auth_last_sign_in_at],ts=tradeStats(u.id).last,p=payments.find(x=>x.user_id===u.id);if(ts)a.push(ts.created_at);if(p)a.push(p.created_at);a=a.filter(Boolean).sort((x,y)=>new Date(y)-new Date(x));let latest=a[0]||null,type='Регистрация';if(latest===u.auth_last_sign_in_at)type='Вход';if(ts&&latest===ts.created_at)type='Сделка';if(p&&latest===p.created_at)type='Платёж';return{at:latest,type,trade:ts,pay:p}}
async function api(action,body={}){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||'')},body:JSON.stringify({action,...body})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Admin API error');return d}
async function init(){try{const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/login';return}const{data:p}=await sb.from('profiles').select('full_name,username,role').eq('id',session.user.id).single();if(!p||p.role!=='admin'){location.href='/cabinet';return}document.getElementById('admin-name').innerHTML=esc(p.full_name||p.username||session.user.email||'Admin')+'<small>ADMINISTRATOR</small>';await loadAll()}catch(e){console.error(e);location.href='/login'}finally{document.getElementById('loading').classList.add('hide')}}
async function logout(){await sb.auth.signOut();location.href='/login'}
function page(n,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');b?.classList.add('active');const m={overview:['Обзор','Контроль платформы'],users:['Пользователи','Доступ, активность и управление'],activity:['Активность','Что происходит в Orbitum'],payments:['Платежи','Подтверждение транзакций']};document.getElementById('page-title').textContent=m[n][0];document.getElementById('page-sub').textContent=m[n][1];if(n==='users')renderUsers();if(n==='activity')renderActivity();if(n==='payments')renderPayments()}
async function loadAll(){try{const[ur,tr,pr,ar]=await Promise.all([api('get_users',{limit:250}),sb.from('trades').select('*,profiles(full_name,username)').order('created_at',{ascending:false}),sb.from('payments').select('*,profiles(full_name,username)').order('created_at',{ascending:false}),api('get_audit_log',{limit:250}).catch(()=>({rows:[]}))]);users=ur.users||[];trades=tr.data||[];payments=pr.data||[];audit=ar.rows||[];document.getElementById('nav-users-count').textContent=users.length;document.getElementById('nav-audit-count').textContent=audit.length;document.getElementById('nav-pending-count').textContent=payments.filter(x=>x.status==='pending').length;renderOverview();renderUsers();renderActivity();renderPayments()}catch(e){toast(e.message,'err')}}
function renderOverview(){let paid=users.filter(u=>['lifetime','monthly'].includes(planOf(u))).length,locked=users.filter(u=>u.auth_banned).length,tg=users.filter(u=>u.tg_linked).length,pending=payments.filter(x=>x.status==='pending').length;document.getElementById('overview-metrics').innerHTML=`<div class="metric"><label>Users</label><strong>${users.length}</strong><small>${paid} paid</small></div><div class="metric"><label>Login locked</label><strong>${locked}</strong><small>${users.length-locked} open</small></div><div class="metric"><label>Telegram</label><strong>${tg}</strong><small>${users.length?Math.round(tg/users.length*100):0}% linked</small></div><div class="metric"><label>Trades / pending</label><strong>${trades.length}</strong><small>${pending} pending payments</small></div>`;renderFeed('overview-feed','all','',12)}
function visibleUsers(){let q=document.getElementById('user-search')?.value.toLowerCase()||'',pf=document.getElementById('plan-filter')?.value||'all',lf=document.getElementById('login-filter')?.value||'all',tf=document.getElementById('tg-filter')?.value||'all',sort=document.getElementById('sort-users')?.value||'activity',a=[...users];if(pf!=='all')a=a.filter(u=>planOf(u)===pf);if(lf==='open')a=a.filter(u=>!u.auth_banned);if(lf==='locked')a=a.filter(u=>u.auth_banned);if(tf==='yes')a=a.filter(u=>u.tg_linked);if(tf==='no')a=a.filter(u=>!u.tg_linked);if(q)a=a.filter(u=>[nameOf(u),u.email,u.id,u.username].some(x=>String(x||'').toLowerCase().includes(q)));a.sort((x,y)=>sort==='new'?new Date(y.created_at)-new Date(x.created_at):sort==='trades'?tradeStats(y.id).n-tradeStats(x.id).n:sort==='pnl'?tradeStats(y.id).p-tradeStats(x.id).p:sort==='name'?nameOf(x).localeCompare(nameOf(y)):(new Date(lastActivity(y).at||0)-new Date(lastActivity(x).at||0)));return a}
function renderUsers(){let a=visibleUsers(),locked=a.filter(u=>u.auth_banned).length,paid=a.filter(u=>planOf(u)!=='free').length,tg=a.filter(u=>u.tg_linked).length,active=a.filter(u=>Date.now()-new Date(lastActivity(u).at||0)<7*864e5).length;document.getElementById('user-summary').innerHTML=`<div class="sum"><label>В выборке</label><b>${a.length}</b><small>${locked} locked</small></div><div class="sum"><label>Paid</label><b>${paid}</b><small>monthly + lifetime</small></div><div class="sum"><label>TG linked</label><b>${tg}</b><small>${a.length?Math.round(tg/a.length*100):0}%</small></div><div class="sum"><label>Active 7d</label><b>${active}</b><small>login / trade / pay</small></div>`;if(!selectedUser||!a.some(u=>u.id===selectedUser))selectedUser=a[0]?.id||null;document.getElementById('users-list').innerHTML=a.length?a.map(u=>rowUser(u,u.id===selectedUser)).join(''):'<div class="empty">Нет пользователей</div>';let sa=document.getElementById('select-all');if(sa)sa.checked=a.length&&a.every(u=>selected.has(u.id));renderInspector();bulkBar()}
function rowUser(u,active){let s=tradeStats(u.id),la=lastActivity(u),checked=selected.has(u.id),pnl=s.n?(s.p>=0?'+$':'−$')+Math.abs(s.p).toFixed(0):'—';return `<div class="urow ${active?'active':''}" onclick="selectedUser='${u.id}';renderUsers()"><div onclick="event.stopPropagation()"><input class="check" type="checkbox" ${checked?'checked':''} onchange="toggleSel('${u.id}',this.checked)"></div><div class="person"><div class="ava">${esc(nameOf(u)[0].toUpperCase())}</div><div style="min-width:0"><div class="pname">${esc(nameOf(u))}</div><div class="pemail">${esc(u.email||u.id)}</div></div></div><div>${pill(u)}<span class="state ${u.auth_banned?'locked':'open'}">● ${u.auth_banned?'Locked':'Open'}</span></div><div class="cell strong">${s.n}</div><div class="cell strong" style="color:${s.n?(s.wr>=50?'#39dca6':'#ff6b6b'):'inherit'}">${s.n?s.wr+'%':'—'}</div><div class="cell strong" style="color:${s.p>=0?'#39dca6':'#ff6b6b'}">${pnl}</div><div class="cell activity-cell">${esc(la.type)}<small>${ago(la.at)} · ${fmtDate(la.at)}</small>${la.trade?`<small>${esc(la.trade.pair||'')} · ${esc(la.trade.result||'')}</small>`:''}</div><div class="tg">${u.tg_linked?'✓':'—'}</div><div class="actions" onclick="event.stopPropagation()"><button class="mini ${u.auth_banned?'green':'red'}" onclick="setLogin('${u.id}',${u.auth_banned?'false':'true'})">${u.auth_banned?'Unlock':'Lock'}</button><button class="mini green" onclick="setPlan('${u.id}','lifetime')">∞</button><button class="mini orange" onclick="setPlan('${u.id}','monthly')">M</button>${u.tg_chat_id?`<button class="mini blue" onclick="sendTG('${u.id}')">TG</button>`:''}</div></div>`}
function toggleSel(id,on){on?selected.add(id):selected.delete(id);bulkBar();let a=visibleUsers(),x=document.getElementById('select-all');if(x)x.checked=a.length&&a.every(u=>selected.has(u.id))}function selectAll(on){visibleUsers().forEach(u=>on?selected.add(u.id):selected.delete(u.id));renderUsers()}function clearSelection(){selected.clear();renderUsers()}function bulkBar(){let e=document.getElementById('bulk');e.classList.toggle('show',selected.size>0);document.getElementById('bulk-count').textContent=selected.size+' selected'}
async function bulkPlan(plan){if(!selected.size)return;if(!confirm(`Изменить план у ${selected.size} пользователей?`))return;try{await api('bulk_set_plan',{userIds:[...selected],plan});toast('Планы обновлены','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function bulkLogin(locked){if(!selected.size)return;if(!confirm(`${locked?'Заблокировать':'Разблокировать'} вход у ${selected.size} пользователей?`))return;try{let r=await api('bulk_set_auth_access',{userIds:[...selected],locked});toast(`${r.updated||0} updated${r.failed?' / '+r.failed+' failed':''}`,'ok');await loadAll()}catch(e){toast(e.message,'err')}}async function bulkModules(){if(!selected.size)return;let raw=prompt('Модули через запятую:',FEATURES.join(','));if(raw==null)return;try{await api('bulk_set_features',{userIds:[...selected],features:raw.split(',').map(x=>x.trim()).filter(Boolean)});toast('Модули обновлены','ok');await loadAll()}catch(e){toast(e.message,'err')}}
function renderInspector(){let e=document.getElementById('inspector'),u=users.find(x=>x.id===selectedUser);if(!u){e.className='inspector empty';e.innerHTML='Выбери пользователя';return}e.className='inspector';let s=tradeStats(u.id),la=lastActivity(u),features=Array.isArray(u.features)?u.features:['journal'];e.innerHTML=`<div class="ins-top"><div class="ava">${esc(nameOf(u)[0].toUpperCase())}</div><div><div class="ins-name">${esc(nameOf(u))}</div><div class="ins-meta">${esc(u.email||'—')}<br>${esc(u.id)}</div></div></div><div class="statusbar ${u.auth_banned?'locked':'open'}">● ${u.auth_banned?'LOGIN LOCKED':'LOGIN OPEN'}${u.auth_banned_until?' · '+fmtDate(u.auth_banned_until):''}</div><div class="ins-stats"><div class="istat"><label>Trades</label><b>${s.n}</b></div><div class="istat"><label>Win rate</label><b>${s.n?s.wr+'%':'—'}</b></div><div class="istat"><label>P&L</label><b style="color:${s.p>=0?'#39dca6':'#ff6b6b'}">${s.n?(s.p>=0?'+$':'−$')+Math.abs(s.p).toFixed(0):'—'}</b></div><div class="istat"><label>Last sign-in</label><b style="font-size:10px">${u.auth_last_sign_in_at?ago(u.auth_last_sign_in_at):'—'}</b></div></div><div class="section"><h4>Login & plan</h4><div class="section-actions"><button class="btn ${u.auth_banned?'green':'red'}" onclick="setLogin('${u.id}',${u.auth_banned?'false':'true'})">${u.auth_banned?'Unlock login':'Lock login'}</button><button class="btn green" onclick="setPlan('${u.id}','lifetime')">∞ Lifetime</button><button class="btn orange" onclick="setPlan('${u.id}','monthly')">Monthly</button><button class="btn" onclick="setPlan('${u.id}','none')">No plan</button></div></div><div class="section"><h4>Modules</h4><div id="features">${FEATURES.map(f=>`<button class="feature ${features.includes(f)?'on':''}" data-f="${f}" onclick="this.classList.toggle('on')">${f}</button>`).join('')}</div><button class="btn orange" style="margin-top:7px" onclick="saveFeatures('${u.id}')">Save modules</button></div><div class="section"><h4>Actions</h4><div class="section-actions">${u.tg_chat_id?`<button class="btn blue" onclick="sendTG('${u.id}')">Message TG</button>`:''}<button class="btn red" onclick="deleteData('${u.id}')">Delete data</button></div></div><div class="section"><h4>Last events</h4><div class="timeline">${timelineFor(u).map(x=>`<div class="tl"><span class="dot ${x.type}"></span><div><b>${esc(x.title)}</b><small>${esc(x.meta)}</small></div></div>`).join('')}</div></div>`}
function timelineFor(u){let a=[{type:'',title:'Регистрация',meta:fmtDate(u.created_at)}];if(u.auth_last_sign_in_at)a.push({type:'',title:'Последний вход',meta:fmtDate(u.auth_last_sign_in_at)});let t=tradeStats(u.id).last;if(t)a.push({type:'trade',title:'Сделка '+(t.pair||''),meta:(t.result||'')+' · '+fmtDate(t.created_at)});let p=payments.find(x=>x.user_id===u.id);if(p)a.push({type:'payment',title:'Платёж '+(p.plan||''),meta:(p.status||'')+' · '+(p.amount_usdt||0)+' USDT · '+fmtDate(p.created_at)});return a}
async function setPlan(id,plan){if(!confirm('Изменить план?'))return;try{await api('set_plan',{userId:id,plan});toast('План обновлён','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function setLogin(id,locked){if(!confirm(locked?'Заблокировать вход?':'Разблокировать вход?'))return;try{await api('set_auth_access',{userId:id,locked});toast(locked?'Login locked':'Login unlocked','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function saveFeatures(id){let f=[...document.querySelectorAll('#features .feature.on')].map(x=>x.dataset.f);try{await api('set_features',{userId:id,features:f});toast('Модули сохранены','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function sendTG(id){let msg=prompt('Сообщение пользователю:');if(!msg)return;try{await api('send_tg',{userId:id,data:{text:'📢 <b>ORBITUM</b>\n\n'+msg}});toast('Отправлено','ok');await loadAudit()}catch(e){toast(e.message,'err')}}async function deleteData(id){if(!confirm('Удалить данные пользователя?'))return;if(!confirm('Это необратимо. Продолжить?'))return;try{await api('delete_user',{userId:id});selected.delete(id);selectedUser=null;toast('Данные удалены','ok');await loadAll()}catch(e){toast(e.message,'err')}}
function allEvents(){let a=[];audit.forEach(x=>a.push({kind:'admin',at:x.created_at,who:(x.action||'admin')+' → '+(x.target_user_id?userName(x.target_user_id):'platform'),detail:auditDetail(x),search:JSON.stringify(x)}));trades.slice(0,300).forEach(x=>a.push({kind:'trade',at:x.created_at,who:x.profiles?.full_name||x.profiles?.username||userName(x.user_id),detail:`${x.pair||'—'} ${(x.direction||'').toUpperCase()} · ${x.result||'—'} · ${x.pnl_usd==null?'P&L —':'P&L '+(x.pnl_usd>=0?'+$':'−$')+Math.abs(x.pnl_usd).toFixed(0)}`,search:JSON.stringify(x)}));payments.slice(0,300).forEach(x=>a.push({kind:'payment',at:x.created_at,who:x.profiles?.full_name||x.profiles?.username||userName(x.user_id),detail:`${x.status||'—'} · ${x.plan||'—'} · ${x.amount_usdt||0} USDT`,search:JSON.stringify(x)}));users.forEach(x=>a.push({kind:'signup',at:x.created_at,who:nameOf(x),detail:'Регистрация · '+(x.email||'—'),search:JSON.stringify(x)}));return a.sort((x,y)=>new Date(y.at)-new Date(x.at))}
function userName(id){let u=users.find(x=>x.id===id);return u?nameOf(u):'#'+String(id||'').slice(0,8)}function auditDetail(x){let m=x.metadata||{};if((x.action||'').includes('plan'))return 'Plan '+(m.plan||'—')+(Array.isArray(m.user_ids)?' · '+m.user_ids.length+' users':'');if((x.action||'').includes('lock'))return Array.isArray(m.user_ids)?m.user_ids.length+' users':'Login access';if(x.action==='broadcast')return `audience ${m.audience||'all'} · sent ${m.sent||0} · failed ${m.failed||0}`;if((x.action||'').includes('features'))return 'Modules '+(m.features||[]).join(', ');return Object.keys(m).length?JSON.stringify(m):x.target_type||'admin action'}
function renderFeed(id,filter='all',q='',limit=400){let e=document.getElementById(id),a=allEvents().filter(x=>(filter==='all'||x.kind===filter)&&(!q||(`${x.who} ${x.detail} ${x.search}`).toLowerCase().includes(q.toLowerCase()))).slice(0,limit);e.innerHTML=a.length?a.map(x=>`<div class="feed-row"><div class="ftime">${fmtDate(x.at)}<br>${ago(x.at)}</div><div class="ftype ${x.kind}">${x.kind}</div><div class="fwho">${esc(x.who)}</div><div class="fdetail">${esc(x.detail)}</div></div>`).join(''):'<div class="empty">Нет событий</div>'}
function renderActivity(){let f=document.getElementById('activity-filter')?.value||'all',q=document.getElementById('activity-search')?.value||'',a=allEvents().filter(x=>(f==='all'||x.kind===f)&&(!q||(`${x.who} ${x.detail} ${x.search}`).toLowerCase().includes(q.toLowerCase()))),day=a.filter(x=>Date.now()-new Date(x.at).getTime()<864e5).length;document.getElementById('activity-summary').innerHTML=`<div class="sum"><label>Events</label><b>${a.length}</b><small>current filter</small></div><div class="sum"><label>24 hours</label><b>${day}</b><small>recent</small></div><div class="sum"><label>Admin audit</label><b>${audit.length}</b><small>recorded actions</small></div><div class="sum"><label>Locked</label><b>${users.filter(u=>u.auth_banned).length}</b><small>login status</small></div>`;renderFeed('activity-feed',f,q,400)}async function loadAudit(){try{let r=await api('get_audit_log',{limit:250});audit=r.rows||[];document.getElementById('nav-audit-count').textContent=audit.length;renderActivity();renderOverview()}catch(e){toast(e.message,'err')}}
function renderPayments(){let pending=payments.filter(x=>x.status==='pending').length,confirmed=payments.filter(x=>x.status==='confirmed').length,revenue=payments.filter(x=>x.status==='confirmed').reduce((s,x)=>s+(+x.amount_usdt||0),0);document.getElementById('payment-summary').innerHTML=`<div class="sum"><label>Pending</label><b>${pending}</b><small>waiting</small></div><div class="sum"><label>Confirmed</label><b>${confirmed}</b><small>all time</small></div><div class="sum"><label>Revenue</label><b>$${revenue.toFixed(0)}</b><small>confirmed</small></div><div class="sum"><label>Total</label><b>${payments.length}</b><small>transactions</small></div>`;document.getElementById('payments-list').innerHTML=payments.length?payments.map(x=>`<div class="pay-row"><div><div class="pname">${esc(x.profiles?.full_name||x.profiles?.username||userName(x.user_id))}</div><div class="pemail">${fmtDate(x.created_at)}</div></div><div class="cell">${esc(x.plan||'—')}</div><div class="cell strong">${x.amount_usdt||0} USDT</div><div class="cell">${esc(x.status||'—')}</div><div class="actions">${x.status==='pending'?`<button class="mini green" onclick="confirmPay('${x.id}','${x.user_id}','${x.plan}')">Confirm</button><button class="mini red" onclick="rejectPay('${x.id}')">Reject</button>`:''}</div></div>`).join(''):'<div class="empty">Платежей нет</div>'}async function confirmPay(pid,uid,plan){try{await api('confirm_payment',{payId:pid,userId:uid,plan});toast('Платёж подтверждён','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function rejectPay(pid){try{await api('reject_payment',{payId:pid});toast('Платёж отклонён','ok');await loadAll()}catch(e){toast(e.message,'err')}}
async function broadcast(){let audience=prompt('Audience: all / paid / free','all');if(!audience)return;let text=prompt('Telegram message:');if(!text)return;try{let r=await api('broadcast',{audience,text});toast(`Sent ${r.sent||0}, failed ${r.failed||0}`,'ok');await loadAudit()}catch(e){toast(e.message,'err')}}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('ru-RU'),1000);init();
</script>
