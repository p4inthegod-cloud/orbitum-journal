ght:32px;border:1px solid #ffffff12;border-radius:9px;background:#ffffff05;color:#ffffff8c;padding:0 10px;cursor:pointer;font-size:9px}.ghost:hover{border-color:#ff7a2f55;color:#ff9258}.content{overflow:auto;padding:16px 18px 30px}.page{display:none}.page.active{display:block}.metrics,.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.metric,.sum{background:#11141d;border:1px solid #ffffff10;border-radius:14px;padding:13px}.metric label,.sum label{display:block;font:500 8px JetBrains Mono;color:#ffffff45;text-transform:uppercase;letter-spacing:1px}.metric b{display:block;font-size:24px;margin-top:8px}.sum b{display:block;font-size:18px;margin-top:7px}.metric small,.sum small{display:block;color:#ffffff42;font-size:9px;margin-top:5px}.panel{background:#11141d;border:1px solid #ffffff10;border-radius:15px;overflow:hidden}.panelhead{padding:12px 14px;border-bottom:1px solid #ffffff0e;display:flex;align-items:center;gap:8px}.panelhead b{font-size:11px}.panelhead span{font:400 8px JetBrains Mono;color:#ffffff3b}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.search,.select{height:34px;background:#11141d;border:1px solid #ffffff12;border-radius:9px;color:#eaf0f6;outline:none;font:400 9px JetBrains Mono}.search{padding:0 10px;min-width:230px;flex:1}.select{padding:0 8px}.search:focus,.select:focus{border-color:#ff7a2f66}.table{overflow:auto}.headrow,.userrow{min-width:940px;display:grid;grid-template-columns:24px minmax(200px,2fr) .9fr .6fr .7fr .8fr 1.2fr .5fr 1.2fr;gap:8px;align-items:center}.headrow{padding:10px 12px;background:#ffffff04;border-bottom:1px solid #ffffff10;color:#ffffff46;font:500 8px JetBrains Mono;text-transform:uppercase}.userrow{padding:11px 12px;border-bottom:1px solid #ffffff0a}.userrow:hover{background:#ffffff04}.check{appearance:none;width:14px;height:14px;border:1px solid #ffffff22;border-radius:4px;background:#171b24;cursor:pointer}.check:checked{background:#ff7a2f;border-color:#ff7a2f}.person{display:flex;align-items:center;gap:9px;min-width:0}.ava{width:29px;height:29px;border:1px solid #ff7a2f44;background:#ff7a2f12;color:#ff985f;border-radius:8px;display:grid;place-items:center;font-weight:700}.pname{font-weight:600;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pemail{font:400 8px JetBrains Mono;color:#ffffff43;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.cell{font-size:9.5px;color:#ffffff91}.strong{color:#f4f6f8;font-weight:600}.pill{display:inline-flex;padding:3px 6px;border-radius:999px;border:1px solid #ffffff12;font:500 8px JetBrains Mono}.life{color:#39dca6;border-color:#39dca644}.month{color:#ff9050;border-color:#ff7a2f44}.free{color:#ffffff55}.locked{display:block;color:#ff6b6b;font:500 8px JetBrains Mono;margin-top:3px}.open{display:block;color:#39dca6;font:500 8px JetBrains Mono;margin-top:3px}.actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.mini,.btn{border:1px solid #ffffff12;background:transparent;color:#ffffff9b;border-radius:7px;cursor:pointer;font:500 8px JetBrains Mono}.mini{height:25px;padding:0 7px}.btn{height:29px;padding:0 9px}.green{color:#39dca6;border-color:#39dca644}.orange{color:#ff9050;border-color:#ff7a2f44}.red{color:#ff6b6b;border-color:#ff6b6b44}.blue{color:#8aa8ff;border-color:#8aa8ff44}.bulk{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;border:1px solid #ff7a2f38;background:#ff7a2f0c;border-radius:11px;padding:8px}.bulk.show{display:flex}.bulk span{font:600 8px JetBrains Mono;color:#ff985e}.feedrow{display:grid;grid-template-columns:120px 80px minmax(160px,1fr) minmax(220px,2fr);gap:9px;padding:10px 12px;border-bottom:1px solid #ffffff0a}.feedrow:last-child{border-bottom:0}.feedrow small{font:400 8px JetBrains Mono;color:#ffffff42}.ftype{font:600 8px JetBrains Mono;text-transform:uppercase}.ftype.payment{color:#8aa8ff}.ftype.trade{color:#39dca6}.ftype.admin{color:#ff9050}.payhead,.payrow{min-width:980px;display:grid;grid-template-columns:minmax(180px,1.35fr) .75fr .65fr .8fr minmax(160px,1fr) minmax(160px,1fr) 1fr;gap:9px;align-items:center}.payhead{padding:10px 12px;background:#ffffff04;border-bottom:1px solid #ffffff10;color:#ffffff46;font:500 8px JetBrains Mono;text-transform:uppercase}.payrow{padding:11px 12px;border-bottom:1px solid #ffffff0a}.payrow.pending{background:linear-gradient(90deg,#f5b8410d,transparent)}.status{font:600 8px JetBrains Mono;text-transform:uppercase}.status.pending{color:#f5b841}.status.confirmed{color:#39dca6}.status.rejected{color:#ff6b6b}.tx{font:400 8px JetBrains Mono;color:#ffffff55;word-break:break-all}.tgname{color:#8aa8ff;font:600 9px JetBrains Mono}.notice{padding:10px 12px;border:1px solid #ff6b6b44;background:#ff6b6b0c;border-radius:10px;color:#ff9191;font:500 9px JetBrains Mono;margin-bottom:10px;display:none}.notice.show{display:block}.empty{padding:26px;text-align:center;color:#ffffff42;font:400 9px JetBrains Mono}.toast{position:fixed;right:16px;bottom:16px;padding:9px 11px;border:1px solid #ff7a2f55;background:#171b24;border-radius:9px;color:#ff9a62;font:500 9px JetBrains Mono;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.err{border-color:#ff6b6b55;color:#ff8585}.toast.ok{border-color:#39dca655;color:#56dfb5}.loading{position:fixed;inset:0;background:#090b10;display:grid;place-items:center;color:#ff8d4b;font:600 10px JetBrains Mono;letter-spacing:1.5px;z-index:50}.loading.hide{opacity:0;pointer-events:none;transition:.2s}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.metrics,.summary{grid-template-columns:1fr 1fr}.content{padding:12px}.feedrow{grid-template-columns:90px 70px 1fr}.feedrow>div:last-child{grid-column:1/-1}}
</style>

<body>
<div class="loading" id="loading">ORBITUM ADMIN</div>
<div class="app">
<aside class="side"><div class="brand">ORBITUM <span>ADMIN</span></div><nav class="nav"><small>Dashboard</small><button class="active" data-page="overview" onclick="showPage('overview',this)">▦ Обзор</button><small>Управление</small><button data-page="users" onclick="showPage('users',this)">◎ Пользователи <span class="count" id="ucount">0</span></button><button data-page="payments" onclick="showPage('payments',this)">▣ Платежи <span class="count" id="pcount">0</span></button><button data-page="activity" onclick="showPage('activity',this)">▥ Активность</button><small>Orbitum</small><a href="/screener">Скринер</a><a href="/journal">Журнал</a><a href="/">Главная</a></nav><div class="sidefoot"><div class="adminname" id="adminname">Admin<small>ADMINISTRATOR</small></div><button class="logout" onclick="logout()">Выйти</button></div></aside>
<main class="main"><header class="top"><div><div class="title" id="title">Обзор</div><div class="sub" id="subtitle">Контроль платформы</div></div><div class="spacer"></div><div class="clock" id="clock"></div><button class="ghost" onclick="loadAll(true)">↻ Обновить</button></header><div class="content">
<section class="page active" id="overview"><div class="metrics" id="metrics"></div><div class="panel"><div class="panelhead"><b>Последние события</b><span>автообновление каждые 10 сек</span></div><div id="overviewfeed"></div></div></section>
<section class="page" id="users"><div class="toolbar"><input class="search" id="search" placeholder="Имя, email, username..." oninput="renderUsers()"><select class="select" id="planfilter" onchange="renderUsers()"><option value="all">Все планы</option><option value="lifetime">Lifetime</option><option value="monthly">Monthly</option><option value="free">Без подписки</option></select><select class="select" id="loginfilter" onchange="renderUsers()"><option value="all">Любой login</option><option value="open">Open</option><option value="locked">Locked</option></select><select class="select" id="sort" onchange="renderUsers()"><option value="activity">Активность</option><option value="new">Новые</option><option value="trades">Сделки</option><option value="pnl">P&L</option></select></div><div class="bulk" id="bulk"><span id="bulkcount">0 selected</span><button class="btn green" onclick="bulkPlan('lifetime')">∞ Lifetime</button><button class="btn orange" onclick="bulkPlan('monthly')">Monthly</button><button class="btn" onclick="bulkPlan('none')">No plan</button><button class="btn green" onclick="bulkLogin(false)">Unlock</button><button class="btn red" onclick="bulkLogin(true)">Lock</button></div><div class="summary" id="usersummary"></div><div class="panel table"><div class="headrow"><div><input type="checkbox" class="check" id="allcheck" onchange="selectAll(this.checked)"></div><div>User</div><div>Access</div><div>Trades</div><div>WR</div><div>P&L</div><div>Last activity</div><div>TG</div><div style="text-align:right">Actions</div></div><div id="userslist"></div></div></section>
<section class="page" id="payments"><div class="notice" id="payerror"></div><div class="summary" id="paysummary"></div><div class="panel table"><div class="payhead"><div>User</div><div>Plan</div><div>Amount</div><div>Status</div><div>Telegram / comment</div><div>TX hash</div><div style="text-align:right">Actions</div></div><div id="paymentslist"></div></div></section>
<section class="page" id="activity"><div class="toolbar"><select class="select" id="activityfilter" onchange="renderActivity()"><option value="all">Все события</option><option value="payment">Payments</option><option value="trade">Trades</option><option value="admin">Admin</option></select><input class="search" id="activitysearch" placeholder="Поиск..." oninput="renderActivity()"></div><div class="panel"><div id="activityfeed"></div></div></section>
</div></main></div><div class="toast" id="toast"></div>
<script>
const SB_URL='https://kgutmsosfyyxnlnhucaa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtndXRtc29zZnl5eG5sbmh1Y2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4Njk2NTMsImV4cCI6MjA4ODQ0NTY1M30.yDPTEkhCvVNpLjSSUqEqD_UTR5N0IeZKtkLCNpW7W_Q';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let users=[],trades=[],payments=[],audit=[],selected=new Set(),activePage='overview',loading=false,lastPaymentIds='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,t=''){let e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;clearTimeout(window._tt);window._tt=setTimeout(()=>e.className='toast',2600)}
function fmt(d){if(!d)return'—';return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function ago(d){if(!d)return'—';let m=Math.floor((Date.now()-new Date(d))/60000);return m<1?'сейчас':m<60?m+'м назад':m<1440?Math.floor(m/60)+'ч назад':Math.floor(m/1440)+'д назад'}
function planOf(u){return ['monthly','lifetime'].includes(u.plan)?u.plan:'free'}function nameOf(u){return u.full_name||u.username||u.email||'#'+String(u.id).slice(0,8)}
function userName(id){let u=users.find(x=>x.id===id);return u?nameOf(u):'#'+String(id||'').slice(0,8)}
function tgFromNotes(n){let m=String(n||'').match(/(?:^|;\s*)tg:([^;]+)/);return m?m[1].trim():'—'}
function stats(id){let a=trades.filter(x=>x.user_id===id),w=a.filter(x=>x.result==='win').length,p=a.reduce((s,x)=>s+(+x.pnl_usd||0),0);return{n:a.length,wr:a.length?Math.round(w/a.length*100):0,p,last:a[0]||null}}
function lastAct(u){let vals=[{t:'Регистрация',d:u.created_at},{t:'Вход',d:u.auth_last_sign_in_at}],s=stats(u.id),p=payments.find(x=>x.user_id===u.id);if(s.last)vals.push({t:'Сделка',d:s.last.created_at});if(p)vals.push({t:'Платёж',d:p.created_at});return vals.filter(x=>x.d).sort((a,b)=>new Date(b.d)-new Date(a.d))[0]||{t:'—',d:null}}
async function api(action,body={}){let{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Сессия истекла');let r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...body})});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Admin API '+r.status);return d}
async function init(){try{let{data:{session}}=await sb.auth.getSession();if(!session){location.href='/login';return}let{data:p,error}=await sb.from('profiles').select('full_name,username,role').eq('id',session.user.id).single();if(error||p?.role!=='admin'){location.href='/cabinet';return}document.getElementById('adminname').innerHTML=esc(p.full_name||p.username||session.user.email||'Admin')+'<small>ADMINISTRATOR</small>';await loadAll()}catch(e){toast(e.message,'err')}finally{document.getElementById('loading').classList.add('hide')}}
async function logout(){await sb.auth.signOut();location.href='/login'}
function showPage(n,b){activePage=n;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===n));document.querySelectorAll('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===n));let m={overview:['Обзор','Контроль платформы'],users:['Пользователи','Доступ и активность'],payments:['Платежи','Pending заявки и подтверждение'],activity:['Активность','События Orbitum']};document.getElementById('title').textContent=m[n][0];document.getElementById('subtitle').textContent=m[n][1];renderAll()}
async function loadAll(manual=false){if(loading)return;loading=true;try{let [ur,ar]=await Promise.all([api('get_users',{limit:250}),api('get_audit_log',{limit:250}).catch(()=>({rows:[]}))]);users=ur.users||[];audit=ar.rows||[];let [tr,pr]=await Promise.all([sb.from('trades').select('*').order('created_at',{ascending:false}).limit(500),sb.from('payments').select('*').order('created_at',{ascending:false}).limit(500)]);if(tr.error)throw new Error('Trades: '+tr.error.message);trades=tr.data||[];let pe=document.getElementById('payerror');if(pr.error){payments=[];pe.textContent='Ошибка загрузки payments: '+pr.error.message;pe.classList.add('show')}else{payments=pr.data||[];pe.classList.remove('show');pe.textContent=''}let ids=payments.filter(x=>x.status==='pending').map(x=>x.id).join(',');if(lastPaymentIds&&ids!==lastPaymentIds&&!manual)toast('Новая заявка на оплату','ok');lastPaymentIds=ids;renderAll();if(manual)toast('Обновлено','ok')}catch(e){toast(e.message,'err');console.error(e)}finally{loading=false}}
function renderAll(){document.getElementById('ucount').textContent=users.length;document.getElementById('pcount').textContent=payments.filter(x=>x.status==='pending').length;renderOverview();renderUsers();renderPayments();renderActivity()}
function renderOverview(){let paid=users.filter(u=>planOf(u)!=='free').length,locked=users.filter(u=>u.auth_banned).length,pending=payments.filter(x=>x.status==='pending').length,rev=payments.filter(x=>x.status==='confirmed').reduce((s,x)=>s+(+x.amount_usdt||0),0);document.getElementById('metrics').innerHTML=`<div class="metric"><label>Users</label><b>${users.length}</b><small>${paid} paid</small></div><div class="metric"><label>Pending payments</label><b style="color:${pending?'#f5b841':'inherit'}">${pending}</b><small>${payments.length} total</small></div><div class="metric"><label>Revenue</label><b style="color:#39dca6">$${rev.toFixed(0)}</b><small>confirmed</small></div><div class="metric"><label>Login locked</label><b>${locked}</b><small>${users.length-locked} open</small></div>`;renderFeed('overviewfeed','all','',14)}
function visibleUsers(){let q=document.getElementById('search')?.value.toLowerCase()||'',pf=document.getElementById('planfilter')?.value||'all',lf=document.getElementById('loginfilter')?.value||'all',so=document.getElementById('sort')?.value||'activity',a=[...users];if(pf!=='all')a=a.filter(u=>planOf(u)===pf);if(lf==='open')a=a.filter(u=>!u.auth_banned);if(lf==='locked')a=a.filter(u=>u.auth_banned);if(q)a=a.filter(u=>[nameOf(u),u.email,u.username,u.id].some(x=>String(x||'').toLowerCase().includes(q)));a.sort((x,y)=>so==='new'?new Date(y.created_at)-new Date(x.created_at):so==='trades'?stats(y.id).n-stats(x.id).n:so==='pnl'?stats(y.id).p-stats(x.id).p:new Date(lastAct(y).d||0)-new Date(lastAct(x).d||0));return a}
function pill(u){let p=planOf(u);return `<span class="pill ${p==='lifetime'?'life':p==='monthly'?'month':'free'}">${p==='lifetime'?'∞ Lifetime':p==='monthly'?'Monthly':'No plan'}</span>`}
function renderUsers(){let a=visibleUsers(),paid=a.filter(u=>planOf(u)!=='free').length,locked=a.filter(u=>u.auth_banned).length,tg=a.filter(u=>u.tg_linked).length,active=a.filter(u=>Date.now()-new Date(lastAct(u).d||0)<7*864e5).length;document.getElementById('usersummary').innerHTML=`<div class="sum"><label>В выборке</label><b>${a.length}</b><small>${locked} locked</small></div><div class="sum"><label>Paid</label><b>${paid}</b><small>monthly + lifetime</small></div><div class="sum"><label>TG linked</label><b>${tg}</b><small>${a.length?Math.round(tg/a.length*100):0}%</small></div><div class="sum"><label>Active 7d</label><b>${active}</b><small>login/trade/pay</small></div>`;document.getElementById('userslist').innerHTML=a.length?a.map(u=>{let s=stats(u.id),la=lastAct(u),pnl=s.n?(s.p>=0?'+$':'−$')+Math.abs(s.p).toFixed(0):'—';return `<div class="userrow"><div><input class="check" type="checkbox" ${selected.has(u.id)?'checked':''} onchange="toggleSel('${u.id}',this.checked)"></div><div class="person"><div class="ava">${esc(nameOf(u)[0]?.toUpperCase()||'U')}</div><div style="min-width:0"><div class="pname">${esc(nameOf(u))}</div><div class="pemail">${esc(u.email||u.id)}</div></div></div><div>${pill(u)}<span class="${u.auth_banned?'locked':'open'}">● ${u.auth_banned?'Locked':'Open'}</span></div><div class="cell strong">${s.n}</div><div class="cell strong">${s.n?s.wr+'%':'—'}</div><div class="cell strong" style="color:${s.p>=0?'#39dca6':'#ff6b6b'}">${pnl}</div><div class="cell">${esc(la.t)}<div class="pemail">${ago(la.d)}</div></div><div class="cell" style="color:${u.tg_linked?'#39dca6':'inherit'}">${u.tg_linked?'✓':'—'}</div><div class="actions"><button class="mini ${u.auth_banned?'green':'red'}" onclick="setLogin('${u.id}',${!u.auth_banned})">${u.auth_banned?'Unlock':'Lock'}</button><button class="mini green" onclick="setPlan('${u.id}','lifetime')">∞</button><button class="mini orange" onclick="setPlan('${u.id}','monthly')">M</button><button class="mini" onclick="setPlan('${u.id}','none')">0</button></div></div>`}).join(''):'<div class="empty">Нет пользователей</div>';let all=document.getElementById('allcheck');if(all)all.checked=a.length&&a.every(u=>selected.has(u.id));renderBulk()}
function toggleSel(id,on){on?selected.add(id):selected.delete(id);renderBulk()}function selectAll(on){visibleUsers().forEach(u=>on?selected.add(u.id):selected.delete(u.id));renderUsers()}function renderBulk(){let e=document.getElementById('bulk');e.classList.toggle('show',selected.size>0);document.getElementById('bulkcount').textContent=selected.size+' selected'}
async function setPlan(id,plan){if(!confirm('Изменить план?'))return;try{await api('set_plan',{userId:id,plan});toast('План обновлён','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function setLogin(id,locked){if(!confirm(locked?'Заблокировать вход?':'Разблокировать вход?'))return;try{await api('set_auth_access',{userId:id,locked});toast(locked?'Login locked':'Login unlocked','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function bulkPlan(plan){if(!selected.size)return;if(!confirm('Изменить план у '+selected.size+' пользователей?'))return;try{await api('bulk_set_plan',{userIds:[...selected],plan});toast('Планы обновлены','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function bulkLogin(locked){if(!selected.size)return;if(!confirm((locked?'Заблокировать ':'Разблокировать ')+selected.size+' пользователей?'))return;try{await api('bulk_set_auth_access',{userIds:[...selected],locked});toast('Готово','ok');await loadAll()}catch(e){toast(e.message,'err')}}
function renderPayments(){let a=[...payments].sort((x,y)=>(x.status==='pending'?0:1)-(y.status==='pending'?0:1)||new Date(y.created_at)-new Date(x.created_at)),pending=a.filter(x=>x.status==='pending').length,confirmed=a.filter(x=>x.status==='confirmed').length,rejected=a.filter(x=>x.status==='rejected').length,rev=a.filter(x=>x.status==='confirmed').reduce((s,x)=>s+(+x.amount_usdt||0),0);document.getElementById('paysummary').innerHTML=`<div class="sum"><label>Pending</label><b style="color:${pending?'#f5b841':'inherit'}">${pending}</b><small>ждут решения</small></div><div class="sum"><label>Confirmed</label><b>${confirmed}</b><small>all time</small></div><div class="sum"><label>Revenue</label><b>$${rev.toFixed(0)}</b><small>confirmed</small></div><div class="sum"><label>Rejected</label><b>${rejected}</b><small>all time</small></div>`;document.getElementById('paymentslist').innerHTML=a.length?a.map(x=>{let u=users.find(z=>z.id===x.user_id),tg=tgFromNotes(x.notes);return `<div class="payrow ${x.status==='pending'?'pending':''}"><div><div class="pname">${esc(u?nameOf(u):userName(x.user_id))}</div><div class="pemail">${fmt(x.created_at)} · #${x.id}</div></div><div class="cell">${esc(x.plan||'—')}</div><div class="cell strong">${x.amount_usdt||0} USDT</div><div class="status ${esc(x.status||'')}">${esc(x.status||'—')}</div><div><div class="tgname">${esc(tg)}</div><div class="pemail">Memo должен совпадать</div></div><div class="tx">${esc(x.tx_hash||'не указан')}</div><div class="actions">${x.status==='pending'?`<button class="mini green" onclick="confirmPay('${x.id}','${x.user_id}','${x.plan}')">Confirm</button><button class="mini red" onclick="rejectPay('${x.id}')">Reject</button>`:''}</div></div>`}).join(''):'<div class="empty">Платежей нет</div>'}
async function confirmPay(pid,uid,plan){if(!confirm('Подтвердить платёж и выдать доступ?'))return;try{await api('confirm_payment',{payId:pid,userId:uid,plan});toast('Платёж подтверждён','ok');await loadAll()}catch(e){toast(e.message,'err')}}async function rejectPay(pid){if(!confirm('Отклонить платёж?'))return;try{await api('reject_payment',{payId:pid});toast('Платёж отклонён','ok');await loadAll()}catch(e){toast(e.message,'err')}}
function events(){let a=[];payments.forEach(x=>a.push({k:'payment',d:x.created_at,w:userName(x.user_id),v:`${x.status} · ${x.plan} · ${x.amount_usdt} USDT · ${tgFromNotes(x.notes)}`}));trades.slice(0,300).forEach(x=>a.push({k:'trade',d:x.created_at,w:userName(x.user_id),v:`${x.pair||'—'} ${(x.direction||'').toUpperCase()} · ${x.result||'—'} · P&L ${x.pnl_usd==null?'—':x.pnl_usd}`}));audit.forEach(x=>a.push({k:'admin',d:x.created_at,w:x.action||'admin',v:x.target_user_id?userName(x.target_user_id):String(x.target_type||'platform')}));return a.sort((x,y)=>new Date(y.d)-new Date(x.d))}
function renderFeed(id,filter='all',q='',limit=400){let a=events().filter(x=>(filter==='all'||x.k===filter)&&(!q||(x.w+' '+x.v).toLowerCase().includes(q.toLowerCase()))).slice(0,limit);document.getElementById(id).innerHTML=a.length?a.map(x=>`<div class="feedrow"><div><small>${fmt(x.d)}<br>${ago(x.d)}</small></div><div class="ftype ${x.k}">${x.k}</div><div class="pname">${esc(x.w)}</div><div class="cell">${esc(x.v)}</div></div>`).join(''):'<div class="empty">Нет событий</div>'}
function renderActivity(){renderFeed('activityfeed',document.getElementById('activityfilter')?.value||'all',document.getElementById('activitysearch')?.value||'',500)}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('ru-RU'),1000);setInterval(()=>{if(document.visibilityState==='visible')loadAll(false)},10000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll(false)});init();
</script>
